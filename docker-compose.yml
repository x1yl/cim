services:
  cim:
    build: .
    container_name: cim
    restart: unless-stopped
    ports:
      - "3002:3001"
    # Use public resolvers so moderation/API lookups don't wait on a slow local DNS.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - MISTRAL_MODERATION_MODEL=${MISTRAL_MODERATION_MODEL:-mistral-moderation-2603}
      - MODERATION_ENABLED=${MODERATION_ENABLED:-true}
      - MODERATION_FAIL_CLOSED=${MODERATION_FAIL_CLOSED:-false}
      - MODERATION_TIMEOUT_MS=${MODERATION_TIMEOUT_MS:-8000}

  # Optional reverse proxy for HTTPS (needed for wss:// on open internet)
  caddy:
    image: caddy:2-alpine
    container_name: cim-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - cim
    profiles: ["tls"]

volumes:
  caddy_data:
  caddy_config:
